name: Verify local evidence lab
on: [push, pull_request]
permissions:
  contents: read
jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CHARTER_OPEN: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Approve ephemeral local fixture
        run: python3 lab.py --operator ci-fixture --approve-local-lab
      - name: Build and start the lab
        run: docker compose --env-file private/compose.env up --build --wait -d
      - name: Verify the signed capture and both reports
        run: python3 tests/smoke.py --export private/reports
      - name: Record the operator walkthrough
        run: |
          python3 -m venv "$RUNNER_TEMP/recording"
          "$RUNNER_TEMP/recording/bin/pip" install playwright==1.65.2
          "$RUNNER_TEMP/recording/bin/python" -m playwright install ffmpeg
          "$RUNNER_TEMP/recording/bin/python" demo/record.py
      - name: Save the synthetic lab reports and video
        uses: actions/upload-artifact@v4
        with:
          name: charter-demo
          path: private/reports/
          if-no-files-found: error
      - name: Inspect service failures
        if: failure()
        run: docker compose --env-file private/compose.env logs --tail=80 capture dashboard juice-shop
      - name: Stop the ephemeral lab
        if: always()
        run: docker compose --env-file private/compose.env down

name: charter
x-service: &service
  image: charter-lab:local
  pull_policy: never
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
x-database: &database
  PGHOST: db
  PGDATABASE: charter
  PGUSER: charter
  PGPASSWORD: ${CHARTER_DB_PASSWORD:?Run lab.py to prepare the lab}

services:
  juice-shop:
    image: bkimminich/juice-shop:v20.4.0
    networks: [target]
    security_opt: [no-new-privileges:true]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: charter
      POSTGRES_USER: charter
      POSTGRES_PASSWORD: ${CHARTER_DB_PASSWORD:?Run lab.py to prepare the lab}
    volumes: [records:/var/lib/postgresql/data]
    networks: [storage]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charter"]
      interval: 3s
      timeout: 2s
      retries: 30
  capture:
    <<: *service
    build: .
    command: ["python", "-m", "app.capture"]
    environment: *database
    volumes: [./private/approved:/run/charter:ro]
    networks: [client, target, storage, egress]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      db: {condition: service_healthy}
      juice-shop: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1',8080),1).close()"]
      interval: 5s
      timeout: 3s
      retries: 24
  dashboard:
    <<: *service
    environment:
      <<: *database
      CHARTER_PROXY: http://capture:8080
      CHARTER_ROOT: /run/charter
      CHARTER_LLM_BASE_URL: ${CHARTER_LLM_BASE_URL:-}
      CHARTER_LLM_API: ${CHARTER_LLM_API:-}
      CHARTER_LLM_API_KEY: ${CHARTER_LLM_API_KEY:-}
      CHARTER_LLM_MODEL: ${CHARTER_LLM_MODEL:-}
    volumes: [./private/approved:/run/charter:ro]
    networks: [storage, client, egress]
    depends_on:
      db: {condition: service_healthy}
      capture: {condition: service_healthy}
  browser:
    image: nginx:stable-alpine
    user: "65534:65534"
    entrypoint: ["nginx", "-g", "daemon off;"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes: [./browser.conf:/etc/nginx/nginx.conf:ro]
    networks: [entry, storage, target]
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:3000:3000"]
    depends_on: [dashboard, juice-shop]
  worker:
    <<: *service
    profiles: [run]
    command: ["python", "-m", "app.worker"]
    environment:
      CHARTER_PROXY: http://capture:8080
      CHARTER_ROOT: /run/charter
    volumes: [./private/approved:/run/charter:ro]
    networks: [client]
    depends_on:
      capture: {condition: service_healthy}
  planner:
    <<: *service
    profiles: [run]
    command: ["python", "-m", "app.campaign"]
    environment:
      <<: *database
      CHARTER_PROXY: http://capture:8080
      CHARTER_ROOT: /run/charter
      CHARTER_LLM_BASE_URL: ${CHARTER_LLM_BASE_URL:-}
      CHARTER_LLM_API: ${CHARTER_LLM_API:-}
      CHARTER_LLM_API_KEY: ${CHARTER_LLM_API_KEY:-}
      CHARTER_LLM_MODEL: ${CHARTER_LLM_MODEL:-}
      CHARTER_GOAL: ${CHARTER_GOAL:-Prove a broken access-control or injection issue on the authorized target. Chain reconnaissance to a demonstrated exploit.}
    volumes: [./private/approved:/run/charter:ro]
    networks: [client, egress]
    depends_on:
      capture: {condition: service_healthy}
networks:
  entry: {}
  client: {internal: true}
  target: {internal: true}
  storage: {internal: true}
  egress: {}
volumes:
  records: {}
